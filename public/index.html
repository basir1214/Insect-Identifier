<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Buggy — Insect Identifier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    html, body { margin: 0; padding: 0; background: #f0eee6; }
    body { font-family: "DM Sans", system-ui, sans-serif; color: #1a1f17; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="common.jsx"></script>
  <script type="text/babel" src="screens-a.jsx"></script>
  <script type="text/babel" src="screens-b.jsx"></script>
  <script type="text/babel" src="desktop.jsx"></script>
  <script type="text/babel" src="tweaks.jsx"></script>
  <script type="text/babel" data-presets="env,react">
    function Phone({ children, w = 380, h = 780 }) {
      return <IOSDevice width={w} height={h}>{children}</IOSDevice>;
    }

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const imgStyle = t.imgStyle || 'photo';
      return (
        <React.Fragment>
          <DesignCanvas>
            <DCSection id="brand" title="Buggy · Insect Identifier" subtitle="Bright, kid-friendly, gamified field guide — placeholder imagery is monospaced; swap in real photos later.">
              <DCArtboard id="cover" label="00 · Cover" width={520} height={780}>
                <div className="app halftone" style={{ width: '100%', height: '100%', background: 'var(--lime)', position: 'relative', overflow: 'hidden' }} data-screen-label="00 Cover">
                  <div style={{ position: 'absolute', top: 40, left: 40 }}>
                    <span className="ribbon">v2 · field guide</span>
                  </div>
                  <div style={{ position: 'absolute', top: 110, left: 40, right: 40 }}>
                    <div className="display" style={{ fontSize: 88, lineHeight: 0.92, letterSpacing: '-0.04em' }}>
                      Buggy.
                    </div>
                    <div className="display" style={{ fontSize: 36, marginTop: 8, color: 'var(--ink-2)' }}>
                      The bug pocket-guide<br/>that knows 19,420 species.
                    </div>
                  </div>
                  <div style={{
                    position: 'absolute', left: 40, bottom: 40, right: 40,
                    display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 14,
                  }}>
                    <div>
                      <div className="mono" style={{ fontSize: 12, color: 'var(--ink-2)' }}>covered in this prototype</div>
                      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 8, maxWidth: 320 }}>
                        {['Camera scan','Audio ID','Confidence','Species page','Journal','Streaks','Quiz','Danger check','Feed','Conservation','Desktop'].map(c =>
                          <span key={c} className="chip" style={{ background: 'var(--paper)', borderColor: 'var(--ink)' }}>{c}</span>
                        )}
                      </div>
                    </div>
                    <div className="wiggle" style={{ flex: '0 0 auto' }}>
                      <div style={{
                        width: 120, height: 120, borderRadius: '50%',
                        background: 'var(--sun)', border: '2px solid var(--ink)',
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        boxShadow: '5px 5px 0 0 var(--ink)',
                      }}>
                        <BugGlyph size={62} color="var(--coral)"/>
                      </div>
                    </div>
                  </div>
                </div>
              </DCArtboard>
            </DCSection>

            <DCSection id="mobile-core" title="Mobile · core flow" subtitle="Camera → identify → result → species page">
              <DCArtboard id="home" label="01 · Home / Camera" width={380} height={780}>
                <div data-screen-label="01 Home">
                  <Phone><HomeScreen imgStyle={imgStyle}/></Phone>
                </div>
              </DCArtboard>
              <DCArtboard id="scan" label="02 · Identifying" width={380} height={780}>
                <div data-screen-label="02 Scan">
                  <Phone><ScanScreen imgStyle={imgStyle}/></Phone>
                </div>
              </DCArtboard>
              <DCArtboard id="result" label="03 · Result" width={380} height={780}>
                <div data-screen-label="03 Result">
                  <Phone><ResultScreen imgStyle={imgStyle}/></Phone>
                </div>
              </DCArtboard>
              <DCArtboard id="species" label="04 · Species detail" width={380} height={780}>
                <div data-screen-label="04 Species">
                  <Phone><SpeciesScreen imgStyle={imgStyle}/></Phone>
                </div>
              </DCArtboard>
            </DCSection>

            <DCSection id="mobile-extras" title="Mobile · collection, audio, social, learning" subtitle="The fun loop — journal, sound ID, feed, quiz, safety">
              <DCArtboard id="journal" label="05 · Journal & streak" width={380} height={780}>
                <div data-screen-label="05 Journal">
                  <Phone><JournalScreen imgStyle={imgStyle}/></Phone>
                </div>
              </DCArtboard>
              <DCArtboard id="audio" label="06 · Audio ID" width={380} height={780}>
                <div data-screen-label="06 Audio">
                  <Phone><AudioScreen imgStyle={imgStyle}/></Phone>
                </div>
              </DCArtboard>
              <DCArtboard id="feed" label="07 · Field feed" width={380} height={780}>
                <div data-screen-label="07 Feed">
                  <Phone><CommunityScreen imgStyle={imgStyle}/></Phone>
                </div>
              </DCArtboard>
              <DCArtboard id="quiz" label="08 · Daily quiz" width={380} height={780}>
                <div data-screen-label="08 Quiz">
                  <Phone><QuizScreen imgStyle={imgStyle}/></Phone>
                </div>
              </DCArtboard>
              <DCArtboard id="danger" label="09 · Safety check" width={380} height={780}>
                <div data-screen-label="09 Danger">
                  <Phone><DangerScreen imgStyle={imgStyle}/></Phone>
                </div>
              </DCArtboard>
            </DCSection>

            <DCSection id="desktop" title="Desktop · naturalist's workspace" subtitle="A web companion for browsing your collection and the global feed">
              <DCArtboard id="dashboard" label="10 · Dashboard" width={1280} height={820}>
                <div data-screen-label="10 Desktop dashboard" style={{ width: '100%', height: '100%' }}>
                  <DesktopApp imgStyle={imgStyle}/>
                </div>
              </DCArtboard>
            </DCSection>
          </DesignCanvas>
          <BuggyTweaks/>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
